name: Issue 10 Temporary Verification

on:
  push:
    branches:
      - v09-10-fog-of-war
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Database tests
        run: npm run test:db

      - name: Unit and scaffold checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
